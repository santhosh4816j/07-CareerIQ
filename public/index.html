<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Workspace</title><link rel="stylesheet" href="/style.css"></head><body><div class="shell"><aside><div class="logo">◈ <span id="brand"></span></div><div class="sideheading">WORKSPACE</div><button class="nav active" data-page="overview">◫ &nbsp; Overview</button><button class="nav" data-page="records">▤ &nbsp; Records</button><button class="nav" data-page="activity">◷ &nbsp; Activity</button><div class="foot">LOCAL DEVELOPMENT<br>PORTFOLIO SERIES</div></aside><main><header><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="subtitle"></p></div><button class="primary" id="add">+ New record</button></header><section id="overview"><div class="metrics"><div class="metric"><label>TOTAL RECORDS</label><strong id="count">0</strong><small>Saved in local JSON</small></div><div class="metric"><label>WORKFLOW STATES</label><strong id="states">0</strong><small>Distinct statuses</small></div><div class="metric"><label>ACTIVITY EVENTS</label><strong id="events">0</strong><small>Recent operations</small></div></div><div class="panel"><h2>Domain intelligence</h2><p class="muted">Rule-based or recorded insights, depending on the project</p><div id="insights"></div></div></section><section id="records" hidden><div class="panel"><div class="toolbar"><h2>Record library</h2><div><input id="search" placeholder="Search all fields"><a class="outline" href="/api/export">Export CSV</a></div></div><div class="tablewrap"><table><thead><tr id="columns"></tr></thead><tbody id="rows"></tbody></table></div></div></section><section id="activity" hidden><div class="panel"><h2>Audit activity</h2><div id="activityList"></div></div></section><footer>DEVELOPED FOR LOCALHOST · FULL-STACK PORTFOLIO</footer></main></div><dialog id="modal"><form id="editor"><div class="dialoghead"><h2 id="modalTitle">New record</h2><button type="button" id="close" c
